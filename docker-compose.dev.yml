
x-api-build: &api-build
  context: ./backend
  dockerfile: Dockerfile.api
  additional_contexts:
    base_image: service:base_image

x-cv-build: &cv-build
  context: ./backend
  dockerfile: Dockerfile.cv
  additional_contexts:
    base_image: service:base_image

x-llm-build: &llm-build
  context: ./backend
  dockerfile: Dockerfile.llm
  additional_contexts:
    base_image: service:base_image

services:

  base_image:
    build:
      context: ./backend
      dockerfile: Dockerfile.base
      target: ${BASE_TARGET:-dev}
    image: visionmetrics_base_image:latest
    container_name: visionmetrics_base_builder
    command: [ "true" ]
    restart: "no"

  db:
    image: postgres:15-alpine
    container_name: visionmetrics_db_dev
    restart: always
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionmetrics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USERNAME -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_migrations:
    build: *api-build
    container_name: visionmetrics_db_migrations_dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.db
    command: [ "alembic", "upgrade", "head" ]
    networks:
      - visionmetrics_net

  redis:
    image: redis:7-alpine
    container_name: visionmetrics_redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - visionmetrics_net

  api:
    build: *api-build
    image: visionmetrics_api:latest
    container_name: visionmetrics_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db_migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploaded_models:/app/uploaded_models
      - ./backend/migrations:/app/migrations
    networks:
      - visionmetrics_net

  celery_worker_cv:
    build: *cv-build
    container_name: visionmetrics_celery_worker_cv_dev
    restart: always
    shm_size: '4gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
    command: [ "celery", "-A", "api_cv.services.celery_app", "worker", "-Q", "cv_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  celery_worker_llm:
    build: *llm-build
    container_name: visionmetrics_celery_worker_llm_dev
    restart: always
    shm_size: '4gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
      - .env.llm
    command: [ "celery", "-A", "api_llm.services.celery_app", "worker", "-Q", "llm_tasks,judge_tasks,attack_build_dataset_tasks,attack_generation_tasks,attack_judge_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  celery_worker_chat:
    build: *llm-build
    container_name: visionmetrics_celery_worker_chat_dev
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
      - .env.llm
    command: [ "celery", "-A", "api_llm.services.celery_app", "worker", "-Q", "chat_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  model_state_manager:
    build: *api-build
    container_name: visionmetrics_state_manager_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      celery_worker_llm:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
    command: [ "python", "-m", "state_manager.main" ]
    networks:
      - visionmetrics_net

  ui:
    build: ./frontend
    container_name: visionmetrics_ui_dev
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - visionmetrics_net

  nginx:
    image: nginx:alpine
    container_name: visionmetrics_nginx_dev
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ui
      - api
    networks:
      - visionmetrics_net

networks:
  visionmetrics_net:
    driver: bridge

volumes:
  postgres_data:
  uploaded_models:
  extracted_datasets:
  model_cache: