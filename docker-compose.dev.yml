services:
  base_image:
    build:
      context: ./backend
      dockerfile: Dockerfile.base
    image: visionmetrics_base_image:latest
    container_name: visionmetrics_base_builder
    profiles:
      - setup

  db:
    image: postgres:15-alpine
    container_name: visionmetrics_db_dev
    restart: always
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionmetrics_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USERNAME -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: visionmetrics_db_migrations_dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.db
    command: [ "alembic", "upgrade", "head" ]
    networks:
      - visionmetrics_net

  redis:
    image: redis:7-alpine
    container_name: visionmetrics_redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - visionmetrics_net

  api_cv:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: visionmetrics_api_cv_dev
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db_migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
    command: ["uvicorn", "api_cv.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - ./backend/migrations:/app/migrations
    networks:
      - visionmetrics_net

  api_llm:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: visionmetrics_api_llm_dev
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env.db
      - .env.shared
      - .env.api
    ports:
      - "8001:8001"
    command: ["uvicorn", "api_llm.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
    networks:
      - visionmetrics_net

  celery_worker_cv:
    build:
      context: ./backend
      dockerfile: Dockerfile.cv
    container_name: visionmetrics_celery_worker_cv_dev
    restart: always
    shm_size: '4gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
    command: [ "celery", "-A", "api_cv.services.celery_app", "worker", "-Q", "cv_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  celery_worker_llm:
    build:
      context: ./backend
      dockerfile: Dockerfile.llm
    container_name: visionmetrics_celery_worker_llm_dev
    restart: always
    shm_size: '4gb'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
      - .env.llm
    command: [ "celery", "-A", "api_llm.services.celery_app", "worker", "-Q", "lm_tasks,judge_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  celery_worker_chat:
    build:
      context: ./backend
      dockerfile: Dockerfile.llm
    container_name: visionmetrics_celery_worker_chat_dev
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
      - .env.api
      - .env.llm
    command: [ "celery", "-A", "api_llm.services.celery_app", "worker", "-Q", "chat_tasks", "--loglevel=info", "--pool=solo" ]
    volumes:
      - ./backend:/app
      - uploaded_models:/app/uploaded_models
      - extracted_datasets:/app/extracted_datasets
      - model_cache:/app/model_cache
    networks:
      - visionmetrics_net

  model_state_manager:
    build:
      context: ./backend
      dockerfile: Dockerfile.llm
    container_name: visionmetrics_state_manager_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      celery_worker_llm:
        condition: service_started
    env_file:
      - .env.db
      - .env.shared
    command: [ "python", "-m", "api_llm.services.model_state_manager" ]
    networks:
      - visionmetrics_net

  ui:
    build: ./frontend
    container_name: visionmetrics_ui_dev
    restart: always
    depends_on:
      - api_cv
      - api_llm
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - visionmetrics_net

  nginx:
    image: nginx:alpine
    container_name: visionmetrics_nginx_dev
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ui
      - api_cv
      - api_llm
    networks:
      - visionmetrics_net

networks:
  visionmetrics_net:
    driver: bridge

volumes:
  postgres_data:
  uploaded_models:
  extracted_datasets:
  model_cache: